<!DOCTYPE HTML>
<html>
<head>
	<title>Verifikasi Sertifikat</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

	<!--
		Kalau folder assets/ dari template Solid State sudah ada di repo yang sama,
		baris ini akan otomatis mewarisi font & warna dasar template. Kalau belum ada
		/ tidak dipakai, halaman ini tetap tampil rapi berkat <style> di bawah.
	-->
	<link rel="stylesheet" href="assets/css/main.css" onerror="this.remove()" />

	<style>
		/* Fallback styling mandiri — supaya halaman tetap rapi walau assets/main.css
		   dari template belum di-setup / gagal dimuat. Warna disamakan kira-kira
		   dengan tema gelap khas Solid State. */
		body {
			background: #1c1d21;
			color: #b5b6ba;
			font-family: "Roboto", Arial, sans-serif;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			margin: 0;
			padding: 20px;
			box-sizing: border-box;
		}
		.card {
			background: #232427;
			border-radius: 8px;
			max-width: 560px;
			width: 100%;
			padding: 2.2em 2.4em;
			box-shadow: 0 10px 30px rgba(0,0,0,0.35);
		}
		.card h1 {
			font-size: 1.4em;
			color: #fff;
			margin: 0 0 0.3em 0;
			letter-spacing: 0.03em;
		}
		.card p.lead {
			margin: 0 0 1.4em 0;
			font-size: 0.95em;
			opacity: 0.75;
		}
		.badge {
			display: inline-block;
			padding: 0.4em 1em;
			border-radius: 20px;
			font-weight: 700;
			font-size: 0.85em;
			letter-spacing: 0.04em;
			margin-bottom: 1.2em;
		}
		.badge.valid   { background: #1f7a3d; color: #eafff0; }
		.badge.invalid { background: #8a2020; color: #ffecec; }
		.badge.loading { background: #444; color: #ddd; }

		dl.detail { margin: 0; }
		dl.detail div {
			display: flex;
			justify-content: space-between;
			gap: 1em;
			padding: 0.5em 0;
			border-bottom: 1px solid rgba(255,255,255,0.08);
		}
		dl.detail div:last-child { border-bottom: none; }
		dl.detail dt { opacity: 0.65; }
		dl.detail dd { margin: 0; color: #fff; font-weight: 600; text-align: right; }

		.score-row { display: flex; gap: 0.8em; margin-top: 1.2em; flex-wrap: wrap; }
		.score-box {
			flex: 1 1 70px;
			background: rgba(255,255,255,0.04);
			border-radius: 6px;
			text-align: center;
			padding: 0.7em 0.4em;
		}
		.score-box .label { font-size: 0.7em; opacity: 0.6; display: block; }
		.score-box .value { font-size: 1.3em; font-weight: 700; color: #fff; }
		.score-box .cefr  { font-size: 0.7em; opacity: 0.6; }

		.msg-not-found { line-height: 1.6; }
		.footer-note {
			margin-top: 1.6em;
			font-size: 0.78em;
			opacity: 0.5;
			text-align: center;
		}
		.search-box { margin-top: 1.4em; display: flex; gap: 0.5em; }
		.search-box input {
			flex: 1;
			padding: 0.6em 0.8em;
			border-radius: 6px;
			border: 1px solid rgba(255,255,255,0.15);
			background: #1c1d21;
			color: #fff;
		}
		.search-box button {
			padding: 0.6em 1.1em;
			border-radius: 6px;
			border: none;
			background: #2e86ab;
			color: #fff;
			cursor: pointer;
			font-weight: 600;
		}
		.search-box button:hover { background: #256e8a; }
	</style>
</head>
<body>

	<div class="card">
		<h1>Verifikasi Sertifikat</h1>
		<p class="lead">One Stop English Education &mdash; TOEFL ITP Test</p>

		<div id="result">
			<span class="badge loading">Memeriksa&hellip;</span>
		</div>

		<!-- Form cek manual (kalau peserta tidak scan lewat QR, tapi ketik kode manual) -->
		<div class="search-box">
			<input id="manual-id" type="text" placeholder="Atau masukkan kode sertifikat manual" />
			<button onclick="cekManual()">Cek</button>
		</div>

		<p class="footer-note">Data diverifikasi terhadap basis data resmi One Stop English Education.</p>
	</div>

	<script>
		// ==========================================================
		// Logika verifikasi — vanilla JS, tidak bergantung ke jQuery
		// atau JS bawaan template, jadi tetap jalan walau assets/js
		// dari Solid State belum di-setup.
		// ==========================================================

		const REGISTRY_URL = "registry_validasi.json"; // path relatif ke file JSON hasil generate

		async function muatRegistry() {
			const res = await fetch(REGISTRY_URL, { cache: "no-store" });
			if (!res.ok) {
				throw new Error("Gagal memuat registry_validasi.json (status " + res.status + ")");
			}
			return res.json();
		}

		function renderValid(entri) {
			const el = document.getElementById("result");
			el.innerHTML = `
				<span class="badge valid">&#10003; Sertifikat Valid</span>
				<dl class="detail">
					<div><dt>Nama</dt><dd>${escapeHtml(entri.name)}</dd></div>
					<div><dt>Nomor Peserta</dt><dd>${escapeHtml(entri.student_number)}</dd></div>
					<div><dt>Tanggal Tes</dt><dd>${escapeHtml(entri.test_date)}</dd></div>
					<div><dt>Skor Total</dt><dd>${escapeHtml(String(entri.total_score))}</dd></div>
					<div><dt>Kode Sertifikat</dt><dd>${escapeHtml(entri.cert_id)}</dd></div>
				</dl>
				<div class="score-row">
					<div class="score-box">
						<span class="label">Listening</span>
						<span class="value">${escapeHtml(String(entri.listening))}</span>
						<span class="cefr">CEFR ${escapeHtml(entri.listening_cefr)}</span>
					</div>
					<div class="score-box">
						<span class="label">Structure</span>
						<span class="value">${escapeHtml(String(entri.structure))}</span>
						<span class="cefr">CEFR ${escapeHtml(entri.structure_cefr)}</span>
					</div>
					<div class="score-box">
						<span class="label">Reading</span>
						<span class="value">${escapeHtml(String(entri.reading))}</span>
						<span class="cefr">CEFR ${escapeHtml(entri.reading_cefr)}</span>
					</div>
				</div>
			`;
		}

		function renderTidakDitemukan(kode) {
			const el = document.getElementById("result");
			el.innerHTML = `
				<span class="badge invalid">&#10007; Tidak Ditemukan</span>
				<p class="msg-not-found">
					Kode sertifikat <strong>${escapeHtml(kode || "-")}</strong> tidak ditemukan di
					basis data kami. Pastikan Anda memindai QR code asli dari sertifikat,
					atau hubungi institusi penerbit untuk konfirmasi lebih lanjut.
				</p>
			`;
		}

		function renderTanpaKode() {
			const el = document.getElementById("result");
			el.innerHTML = `
				<span class="badge invalid">Kode tidak ditemukan di URL</span>
				<p class="msg-not-found">
					Silakan scan QR code pada sertifikat, atau masukkan kode sertifikat
					secara manual di bawah ini.
				</p>
			`;
		}

		function renderError(err) {
			const el = document.getElementById("result");
			el.innerHTML = `
				<span class="badge invalid">Gagal memuat data</span>
				<p class="msg-not-found">${escapeHtml(err.message)}</p>
			`;
		}

		function escapeHtml(str) {
			return String(str)
				.replaceAll("&", "&amp;")
				.replaceAll("<", "&lt;")
				.replaceAll(">", "&gt;")
				.replaceAll('"', "&quot;");
		}

		async function cekKode(kode) {
			document.getElementById("result").innerHTML =
				'<span class="badge loading">Memeriksa&hellip;</span>';
			try {
				const data = await muatRegistry();
				const entri = data.find(row => row.cert_id === kode);
				if (entri) {
					renderValid(entri);
				} else {
					renderTidakDitemukan(kode);
				}
			} catch (err) {
				renderError(err);
			}
		}

		function cekManual() {
			const kode = document.getElementById("manual-id").value.trim();
			if (!kode) return;
			// update URL juga supaya bisa di-bookmark/share
			const url = new URL(window.location.href);
			url.searchParams.set("id", kode);
			window.history.replaceState({}, "", url);
			cekKode(kode);
		}

		// --- Jalan otomatis saat halaman dibuka ---
		(function init() {
			const params = new URLSearchParams(window.location.search);
			const kode = params.get("id");
			if (kode) {
				document.getElementById("manual-id").value = kode;
				cekKode(kode);
			} else {
				renderTanpaKode();
			}
		})();
	</script>

</body>
</html>
